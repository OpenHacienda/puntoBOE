[package]
name = "app720"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
validator720 = { path = "../validator" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "File",
  "FileReader",
  "FileList",
  "DragEvent",
  "DataTransfer",
  "HtmlInputElement",
  "Event",
  "EventTarget",
] }
gloo-file = "0.3"
