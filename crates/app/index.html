<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Validador Modelo 720 — BOE</title>
    <link data-trunk rel="rust" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0f1117;
            --bg-surface: #181a20;
            --bg-elevated: #1e2028;
            --bg-hover: #252830;
            --border: #2a2d37;
            --border-light: #353842;
            --fg: #e4e5e9;
            --fg-secondary: #9ca0ab;
            --fg-muted: #6b7080;
            --accent: #6c8aff;
            --accent-dim: rgba(108, 138, 255, 0.12);
            --accent-hover: #859bff;
            --success: #34d399;
            --success-dim: rgba(52, 211, 153, 0.12);
            --success-border: rgba(52, 211, 153, 0.25);
            --danger: #f87171;
            --danger-dim: rgba(248, 113, 113, 0.10);
            --danger-border: rgba(248, 113, 113, 0.25);
            --warning: #fbbf24;
            --warning-dim: rgba(251, 191, 36, 0.10);
            --warning-border: rgba(251, 191, 36, 0.25);
            --info: #60a5fa;
            --info-dim: rgba(96, 165, 250, 0.10);
            --info-border: rgba(96, 165, 250, 0.25);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
            --shadow-lg: 0 4px 24px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: var(--accent-dim);
            margin-bottom: 1.25rem;
            font-size: 1.5rem;
        }
        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--fg);
            margin-bottom: 0.375rem;
        }
        .header p {
            color: var(--fg-muted);
            font-size: 0.875rem;
            font-weight: 400;
        }
        .header .privacy-note {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            margin-top: 0.5rem;
            padding: 0.25rem 0.75rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.75rem;
            color: var(--fg-secondary);
        }
        .privacy-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }

        /* Drop Zone */
        .dropzone {
            position: relative;
            border: 2px dashed var(--border-light);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--bg-surface);
        }
        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent);
            background: var(--accent-dim);
        }
        .dropzone:hover .dropzone-icon {
            transform: translateY(-2px);
        }
        .dropzone-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            margin-bottom: 1rem;
            transition: transform 0.25s ease;
            font-size: 1.25rem;
        }
        .dropzone h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--fg);
            margin-bottom: 0.25rem;
        }
        .dropzone p {
            font-size: 0.8125rem;
            color: var(--fg-muted);
            margin-bottom: 1.25rem;
        }
        .dropzone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }
        .file-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.25rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius-xs);
            font-size: 0.8125rem;
            font-weight: 600;
            pointer-events: none;
            transition: background 0.2s;
        }
        .dropzone:hover .file-btn {
            background: var(--accent-hover);
        }

        .filename {
            text-align: center;
            color: var(--fg-secondary);
            margin-top: 0.75rem;
            font-size: 0.8125rem;
            font-weight: 500;
        }
        .filename span {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.75rem;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 100px;
        }

        /* Status Badge */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1.5rem 0;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.5rem;
            border-radius: 100px;
            font-weight: 600;
            font-size: 0.9375rem;
            letter-spacing: -0.01em;
        }
        .badge-valid {
            background: var(--success-dim);
            color: var(--success);
            border: 1px solid var(--success-border);
        }
        .badge-invalid {
            background: var(--danger-dim);
            color: var(--danger);
            border: 1px solid var(--danger-border);
        }

        /* Summary Panel */
        .summary {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            margin: 1.5rem 0;
            box-shadow: var(--shadow);
        }
        .summary-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--fg-muted);
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 600px) {
            .summary-grid { grid-template-columns: 1fr; }
        }
        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 0.125rem;
        }
        .summary-item.full-width {
            grid-column: 1 / -1;
        }
        .summary-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .summary-value {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--fg);
            font-variant-numeric: tabular-nums;
        }
        .summary-value.mono {
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.875rem;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.75rem;
            margin-bottom: 0.75rem;
        }
        .section-header h3 {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--fg);
        }
        .section-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            padding: 0 0.375rem;
            border-radius: 100px;
            font-size: 0.6875rem;
            font-weight: 700;
        }
        .section-count.errors {
            background: var(--danger-dim);
            color: var(--danger);
            border: 1px solid var(--danger-border);
        }
        .section-count.warnings {
            background: var(--warning-dim);
            color: var(--warning);
            border: 1px solid var(--warning-border);
        }

        /* Error / Warning Tables */
        .error-table-wrap {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        .error-table {
            width: 100%;
            border-collapse: collapse;
        }
        .error-table th {
            padding: 0.625rem 1rem;
            text-align: left;
            font-size: 0.6875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--fg-muted);
            background: var(--bg-elevated);
            border-bottom: 1px solid var(--border);
        }
        .error-table td {
            padding: 0.625rem 1rem;
            font-size: 0.8125rem;
            border-bottom: 1px solid var(--border);
            color: var(--fg-secondary);
        }
        .error-table tr:last-child td {
            border-bottom: none;
        }
        .error-table tr:hover td {
            background: var(--bg-hover);
        }
        .error-table td:first-child {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-weight: 600;
            font-size: 0.75rem;
        }
        .error-table td:nth-child(2) {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }
        .error-table td:nth-child(3) {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            color: var(--fg-muted);
        }
        .error-table tr.fatal td:first-child { color: var(--danger); }
        .error-table tr.error td:first-child { color: var(--warning); }
        .error-table tr.warning td:first-child { color: var(--info); }

        .error-table tr.fatal td {
            border-left: 3px solid var(--danger);
        }
        .error-table tr.fatal td:not(:first-child) {
            border-left: none;
        }
        .error-table tr.error td {
            border-left: 3px solid var(--warning);
        }
        .error-table tr.error td:not(:first-child) {
            border-left: none;
        }
        .error-table tr.warning td {
            border-left: 3px solid var(--info);
        }
        .error-table tr.warning td:not(:first-child) {
            border-left: none;
        }

        /* Collapsible Warnings */
        .collapsible {
            margin-top: 1.5rem;
        }
        .collapsible > summary {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            list-style: none;
            margin-bottom: 0.75rem;
        }
        .collapsible > summary::-webkit-details-marker { display: none; }
        .collapsible > summary h3 {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--fg);
        }
        .collapsible > summary .chevron {
            display: inline-flex;
            transition: transform 0.2s ease;
            color: var(--fg-muted);
            font-size: 0.75rem;
        }
        .collapsible[open] > summary .chevron {
            transform: rotate(90deg);
        }

        /* Loading */
        .loading {
            text-align: center;
            color: var(--fg-muted);
            margin: 2.5rem 0;
            font-size: 0.875rem;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-light);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            color: var(--fg-muted);
            font-size: 0.75rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.35s ease-out;
        }
    </style>
</head>
<body>
    <div class="container" id="app"></div>
</body>
</html>
